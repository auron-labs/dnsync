name: dnsync

services:
  dnsync:
    image: ${DNSYNC_IMAGE:-ghcr.io/aaronflorey/dnsync:latest}
    restart: unless-stopped
    environment:
      ADGUARD_PASSWORD: ${ADGUARD_PASSWORD:?set ADGUARD_PASSWORD in your shell or .env}
    command:
      - -config
      - /etc/dnsync/config.toml
    volumes:
      - ./config.example.toml:/etc/dnsync/config.toml:ro
      - ./state:/var/lib/dnsync
      - /var/run/docker.sock:/var/run/docker.sock
