[[sources]]
type = "docker"
name = "local-docker"
# Root docker-compose example using the mounted Docker socket.
endpoint = "unix:///var/run/docker.sock"
# Ignore containers started by Compose projects that share this Docker daemon.
exclude_compose_projects = ["dnsync-live-test"]
# Append this suffix to label-derived hostnames like "foo" -> "foo.bar.bz".
base_domain = "bar.bz"
# Set the host-reachable IP that derived DNS records should answer with.
host_ip = "192.168.1.50"

[[outputs]]
type = "adguard"
name = "primary-adguard"
# Replace with the AdGuard Home URL reachable from this container.
url = "http://adguardhome:3000"
username = "admin"
password_ref = "ENV:ADGUARD_PASSWORD"

# Optional: TelltaleDNS local names. The token needs the "write" scope.
# [[outputs]]
# type = "telltaledns"
# name = "primary-telltaledns"
# url = "http://telltale:8053"
# api_key_ref = "ENV:TELLTALEDNS_API_KEY"

# Optional: enable one dedicated Cloudflare Tunnel output. The source name must
# match exactly one [[sources]] entry of type "docker".
# [[outputs]]
# type = "cloudflare"
# name = "primary-cloudflare"
# zone_id = "..."
# api_key_ref = "ENV:CLOUDFLARE_API_KEY"
# [outputs.tunnel]
# account_id = "..."
# name = "dnsync"
# source = "local-docker"
# connector_image = "cloudflare/cloudflared:2026.7.3"

[state]
# The compose file mounts ./state here for persistence across restarts.
path = "/var/lib/dnsync/state.json"

[logging]
# Supported levels: trace, debug, info, warn, error.
level = "info"
format = "json"
max_size_mb = 10
max_backups = 5

[runtime]
# Optional per-operation timeout for external API calls and similar work.
operation_timeout = "10s"
# Empty defaults to 10m; use 0s to disable removal grace.
removal_grace_period = "10m"

[retry]
initial_interval = "1s"
max_interval = "30s"
max_elapsed_time = "5m"
