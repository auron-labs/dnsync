[[sources]]
type = "docker"
name = "local-docker"
# Docker on this host, through the socket that docker-compose.yaml mounts.
endpoint = "unix:///var/run/docker.sock"
# Ignore containers from these Compose projects. dnsync-live-test is this
# repository's test stack.
exclude_compose_projects = ["dnsync-live-test"]
# Domain added to container names: "foo" becomes "foo.bar.bz".
base_domain = "bar.bz"
# The address records point to, usually this Docker host's LAN address.
host_ip = "192.168.1.50"

[[outputs]]
type = "adguard"
name = "primary-adguard"
# AdGuard Home's address, as reachable from the dnsync container.
url = "http://adguardhome:3000"
username = "admin"
password_ref = "ENV:ADGUARD_PASSWORD"

# Optional: TelltaleDNS local names. The token needs the "write" scope.
# [[outputs]]
# type = "telltaledns"
# name = "primary-telltaledns"
# url = "http://telltale:8053"
# api_key_ref = "ENV:TELLTALEDNS_API_KEY"

# Optional: Pi-hole 6 or later. With two-factor authentication, use an app
# password and set Pi-hole's webserver.api.app_sudo to true.
# [[outputs]]
# type = "pihole"
# name = "primary-pihole"
# url = "http://pihole"
# password_ref = "ENV:PIHOLE_PASSWORD"

# Optional: Technitium DNS Server 15.0 or later. The zone must already exist,
# and the token's user must be able to modify and delete records in it.
# [[outputs]]
# type = "technitium"
# name = "primary-technitium"
# url = "http://technitium:5380"
# zone = "bar.bz"
# api_token_ref = "ENV:TECHNITIUM_API_TOKEN"

# Optional: Cloudflare DNS. The [outputs.tunnel] block is also optional; it
# publishes containers labelled proxy.cloudflare.tunnel=true through a
# Cloudflare Tunnel. Its source must be the name of a [[sources]] entry.
# [[outputs]]
# type = "cloudflare"
# name = "primary-cloudflare"
# zone_id = "..."
# api_key_ref = "ENV:CLOUDFLARE_API_KEY"
# [outputs.tunnel]
# account_id = "..."
# name = "dnsync"
# source = "local-docker"
# connector_image = "cloudflare/cloudflared:2026.7.3"

[state]
# Where dnsync records which DNS records it owns. docker-compose.yaml mounts
# ./state here; keep it and back it up.
path = "/var/lib/dnsync/state.json"

[logging]
# Supported levels: trace, debug, info, warn, error.
level = "info"
format = "json"
# Rotation for the log file set by the LOG_FILE environment variable.
max_size_mb = 10
max_backups = 5

[runtime]
# Time limit for each request to Docker or a DNS server.
operation_timeout = "10s"
# How long to wait after a container disappears before removing its records.
# 0s removes them immediately.
removal_grace_period = "10m"

[retry]
# How dnsync retries when Docker or a DNS server fails. It keeps trying,
# waiting up to max_interval between attempts, and logs an error once a
# temporary problem has lasted max_elapsed_time.
initial_interval = "1s"
max_interval = "30s"
max_elapsed_time = "5m"
