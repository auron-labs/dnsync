name: dnsync-live-test

services:
  adguard-init:
    image: curlimages/curl:8.23.0
    depends_on:
      - adguardhome
    environment:
      ADGUARD_PASSWORD: adguard-test-password
    command:
      - sh
      - -ec
      - |
        auth_ready() {
          [ "$(curl -s -o /dev/null -w '%{http_code}' -u "admin:$$ADGUARD_PASSWORD" http://adguardhome:3000/control/rewrite/list || true)" = "200" ]
        }

        until auth_ready || \
          curl -fsS http://adguardhome:3000/control/install/get_addresses >/dev/null 2>&1; do
          sleep 1
        done

        if auth_ready; then
          exit 0
        fi

        curl -fsS \
          -H 'Content-Type: application/json' \
          -X POST \
          http://adguardhome:3000/control/install/configure \
          --data '{"web":{"ip":"0.0.0.0","port":3000},"dns":{"ip":"0.0.0.0","port":53},"username":"admin","password":"'"$$ADGUARD_PASSWORD"'"}'

        until auth_ready; do
          sleep 1
        done
    restart: "no"
  adguardhome:
    image: adguard/adguardhome:v0.107.80
    volumes:
      - ${LIVE_TEST_ADGUARD_CONF_DIR:-./adguard/conf}:/opt/adguardhome/conf
      - ${LIVE_TEST_ADGUARD_WORK_DIR:-./adguard/work}:/opt/adguardhome/work
    ports:
      - "127.0.0.1:5353:53/tcp"
      - "127.0.0.1:5353:53/udp"
      - "127.0.0.1:13000:3000/tcp"
    restart: unless-stopped

  dnsync:
    build:
      context: ../../..
      dockerfile: Dockerfile
    depends_on:
      adguard-init:
        condition: service_completed_successfully
    volumes:
      - ./config.toml:/etc/dnsync/config.toml:ro
      - ${LIVE_TEST_STATE_DIR:-./state}:/var/lib/dnsync
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      ADGUARD_PASSWORD: adguard-test-password
      LOG_FILE: /var/lib/dnsync/runtime.log
    command:
      - -config
      - /etc/dnsync/config.toml
    restart: unless-stopped

  whoami:
    image: traefik/whoami:v1.12.0
    restart: unless-stopped
    labels:
      - proxy.aliases=whoami.test
      - proxy.whoami.test.port=80
      - proxy.whoami.test.host=127.0.0.1
