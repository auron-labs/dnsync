[[sources]]
type = "docker"
name = "socket-proxy"
# TCP socket proxy or remote Docker example.
endpoint = "tcp://docker-socket-proxy:2375"

[[outputs]]
type = "adguard"
name = "primary-adguard"
url = "http://127.0.0.1:3000"
username = "admin"
password_ref = "ENV:ADGUARD_PASSWORD"

[state]
path = "/var/lib/docker-dns-sync/state.json"

[logging]
level = "info"
format = "json"

[retry]
initial_interval = "1s"
max_interval = "30s"
max_elapsed_time = "5m"
